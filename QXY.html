<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>俯仰观照</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;}
  #c{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;display:block;background:#000;}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
(function(){
  "use strict";
  // ---------- 常量 ----------
  const W=1920,H=1080,CX=960,CY=540,N=4000,TOTAL=12,L=6000,F0=900,R=260;
  const TITLE='QC XY';
  const SUB='于江流见瞬息，于树木见永恒';

  // ---------- 工具 ----------
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  const rng=mulberry32(7);
  const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
  function smoothstep(a,b,x){let t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
  function mix(a,b,u){return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u];}

  // ---------- 相机 ----------
  const V0=80,V1=2600;
  const z1=t=>V0*t+(V1-V0)*(3/3.2)*Math.pow(Math.min(t,3)/3,3.2)+V1*Math.max(0,t-3);
  const Z5=z1(5.0),zB=Z5+780,ZC=zB+900,Z3=z1(3),ZT=zB-700;
  function camZ(t){
    if(t<=5.0)return z1(t);
    if(t<=5.6){const u=(t-5.0)/0.6;return Z5+2600*0.6*(u-u*u/2);}
    if(t<=8.0){const v=(t-5.6)/2.4;return zB-2200*(1-(1-v)*(1-v));}
    return zB-2200-120*(t-8.0);
  }
  function focal(t){
    let f=900;
    for(const r of rings){if(t>=r.tk)f+=260*Math.exp(-9*(t-r.tk));}
    if(t>=5.6)f+=520*Math.exp(-6*(t-5.6));
    return f;
  }
  function roll(t){
    let r=0.02*Math.sin(1.7*t);
    if(t>=5.6)r+=0.12*Math.sin(2*Math.PI*0.9*(t-5.6))*Math.exp(-2.2*(t-5.6));
    return r;
  }
  function shake(t){
    if(t>=5.6){const amp=22*Math.exp(-3.2*(t-5.6));return [Math.sin(53*t)*amp,Math.cos(47*t)*amp];}
    return [0,0];
  }
  function speed(t){
    if(t<3)return 80+2520*Math.pow(t/3,2.2);
    if(t<5)return 2600;
    if(t<5.6)return 2600*(1-(t-5)/0.6);
    return 0;
  }

  // ---------- 光环 ----------
  const rings=[];
  for(let k=0;k<5;k++){
    rings.push({z:Z3+2600*(0.3+0.42*k),tk:3.3+0.42*k,even:(k%2===0)});
  }

  // ---------- 标题目标点（离屏采样，启动时一次） ----------
  const tcv=document.createElement('canvas');tcv.width=1200;tcv.height=400;
  const tctx=tcv.getContext('2d');
  tctx.fillStyle='#fff';tctx.textAlign='center';tctx.textBaseline='middle';
  tctx.font='bold 280px "Noto Serif SC","Songti SC","SimSun",serif';
  tctx.fillText(TITLE,600,205);
  const td=tctx.getImageData(0,0,1200,400).data;
  const pts=[];
  for(let y=0;y<400;y+=3)for(let x=0;x<1200;x+=3){
    if(td[(y*1200+x)*4+3]>128)pts.push([(x-600)*2.093,(y-200)*2.093]);
  }
  for(let i=pts.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const tmp=pts[i];pts[i]=pts[j];pts[j]=tmp;}

  // ---------- 粒子（启动时一次） ----------
  const P=[];
  for(let i=0;i<N;i++){
    const a=rng()*Math.PI*2;
    const rho=220+1280*Math.pow(rng(),0.8);
    const zw=rng()*L;
    const s=rng();
    const cls=rng()<0.15?1:0;
    const ph=rng()*Math.PI*2;
    const fq=0.6+1.0*rng();
    const zz=-0.55+1.55*rng();
    const phi=rng()*Math.PI*2;
    const rxy=Math.sqrt(Math.max(0,1-zz*zz));
    const dir={x:rxy*Math.cos(phi),y:rxy*Math.sin(phi),z:zz};
    const mag=300+2600*Math.pow(rng(),1.6);
    const sw=(1.2+2*rng())*(rng()<0.5?-1:1);
    const p=pts.length?pts[i%pts.length]:[0,0];
    const tx=p[0]+(rng()*6-3),ty=p[1]+(rng()*6-3);
    P.push({a,rho,zw,s,cls,ph,fq,dir,mag,sw,tx,ty});
  }

  // ---------- 每颗粒子的相机空间位置 ----------
  function place(p,t){
    if(t<5.6){
      const k=1-0.92*smoothstep(5.0,5.6,t);
      const X=p.rho*Math.cos(p.a)*k;
      const Y=p.rho*Math.sin(p.a)*k;
      const d=((p.zw-camZ(t))%L+L)%L+60;
      return {X,Y,d};
    }else if(t<=8){
      const tau=Math.min(1,(t-5.6)/2.4);
      const g=1-Math.pow(1-tau,3);
      const X=p.dir.x*p.mag*g;
      const Y=p.dir.y*p.mag*g;
      const Z=ZC+p.dir.z*p.mag*g;
      return {X,Y,d:Z-camZ(t)};
    }else{
      const e=smoothstep(8,10,t);
      const Ex=p.dir.x*p.mag,Ey=p.dir.y*p.mag,Ez=ZC+p.dir.z*p.mag;
      const Qx=Ex+(p.tx-Ex)*e,Qy=Ey+(p.ty-Ey)*e,Qz=Ez+(ZT-Ez)*e;
      const th=Math.sin(Math.PI*e)*p.sw;
      const X=Qx*Math.cos(th)-Qy*Math.sin(th);
      const Y=Qx*Math.sin(th)+Qy*Math.cos(th);
      return {X,Y,d:Qz-camZ(t)};
    }
  }
  function proj(X,Y,d,f){return [CX+f*X/d,CY+f*Y/d];}

  // ---------- 绘制 ----------
  const cv=document.getElementById('c');
  const ctx=cv.getContext('2d');

  function draw(t){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;

    // 背景
    ctx.fillStyle='#05060A';ctx.fillRect(0,0,W,H);
    const sp=speed(t);
    const sf=0.45+0.55*clamp(sp/2600,0,1);
    const g=ctx.createRadialGradient(CX,CY,0,CX,CY,700);
    g.addColorStop(0,'rgba(30,60,90,'+(0.28*sf*(t<5.6?1:0.4)).toFixed(4)+')');
    g.addColorStop(1,'rgba(5,6,10,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    const f=focal(t);
    const sh=shake(t);
    const rl=roll(t);

    ctx.save();
    ctx.translate(CX+sh[0],CY+sh[1]);
    ctx.rotate(rl);
    ctx.translate(-CX,-CY);
    ctx.globalCompositeOperation='lighter';
    ctx.lineCap='round';

    // 粒子拖尾
    const DT=t<5.6?0.03:(0.06-0.03*smoothstep(8,9,t));
    const tp=t>=5.6?Math.max(t-DT,5.6):Math.max(t-DT,0);
    const fp=focal(tp);
    for(let i=0;i<N;i++){
      const p=P[i];
      const A=place(p,t),B=place(p,tp);
      if(A.d<30||B.d<30)continue;
      if(Math.abs(A.d-B.d)>500)continue;
      const aS=proj(A.X,A.Y,A.d,f);
      const bS=proj(B.X,B.Y,B.d,fp);
      let col;
      if(t<5.0){col=p.cls?[255,213,154]:[191,232,255];}
      else if(t<5.6){const u=smoothstep(5.0,5.6,t);col=mix(p.cls?[255,213,154]:[191,232,255],[255,255,255],u);}
      else if(t<8){const tau=Math.min(1,(t-5.6)/2.4);if(tau<0.4)col=mix([255,255,255],[255,176,74],tau/0.4);else col=mix([255,176,74],[255,61,110],(tau-0.4)/0.6);}
      else if(t<10){col=mix([255,61,110],[246,235,208],smoothstep(8,10,t));}
      else col=[246,235,208];
      let al;
      if(t<5.6){al=clamp(Math.pow(1-A.d/L,1.4)*(0.25+0.55*p.s)*sf*1.6,0,1);}
      else{const tau=t<8?Math.min(1,(t-5.6)/2.4):1;al=0.9*(0.7+0.3*Math.sin(p.fq*t+p.ph))*(t<8?1-0.4*tau:0.9);}
      let lw;
      if(t<5.6){lw=(0.9+1.8*p.s)*clamp(Math.sqrt(900/A.d),0.5,2.2);}
      else{lw=(2+3*p.s)*clamp(Math.sqrt(900/A.d),0.6,2.2);}
      ctx.strokeStyle='rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+al.toFixed(3)+')';
      ctx.lineWidth=lw;
      ctx.beginPath();ctx.moveTo(bS[0],bS[1]);ctx.lineTo(aS[0],aS[1]);ctx.stroke();
    }

    // 光环（仅 t<5.6）
    if(t<5.6){
      for(const r of rings){
        const d=r.z-camZ(t);
        if(d<40||d>5200)continue;
        const col=r.even?[125,249,255]:[255,213,154];
        const lw=clamp(6*900/d,1.5,16);
        const al=0.6*clamp(1-d/5200,0,1);
        for(let pass=0;pass<2;pass++){
          ctx.strokeStyle='rgba('+col[0]+','+col[1]+','+col[2]+','+(pass?al/4:al).toFixed(3)+')';
          ctx.lineWidth=pass?lw*3:lw;
          ctx.beginPath();
          for(let s=0;s<=96;s++){
            const th=s/96*Math.PI*2;
            const px=CX+f*R*Math.cos(th)/d;
            const py=CY+f*R*Math.sin(th)/d;
            if(s===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
          }
          ctx.stroke();
        }
      }
    }

    // 核心光
    if(t>=4.4){
      const dc=ZC-camZ(t);
      if(dc>40){
        let rad=140000/dc*(0.4+0.6*smoothstep(4.4,5.6,t))*(f/900);
        if(t>=5.6)rad*=Math.exp(-3*(t-5.6));
        const cg=ctx.createRadialGradient(CX,CY,0,CX,CY,rad);
        cg.addColorStop(0,'rgba(255,255,255,0.9)');
        cg.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=cg;ctx.beginPath();ctx.arc(CX,CY,rad,0,Math.PI*2);ctx.fill();
      }
    }

    // 冲击波
    if(t>=5.6){
      const ts=clamp((t-5.6)/1.2,0,1);
      const Rw=3600*(1-Math.pow(1-ts,3));
      const dd=ZC-camZ(t);
      if(ts<1&&dd>40){
        const rad=f*Rw/dd;
        ctx.strokeStyle='rgba(255,255,255,'+(0.8*(1-ts)).toFixed(3)+')';
        ctx.lineWidth=1+8*(1-ts);
        ctx.beginPath();ctx.arc(CX,CY,rad,0,Math.PI*2);ctx.stroke();
      }
    }

    ctx.restore();

    // 闪白
    ctx.globalCompositeOperation='lighter';
    let fa=(t>=5.6?0.95*Math.exp(-9*(t-5.6)):0.7*smoothstep(5.4,5.6,t));
    for(const r of rings){if(t>=r.tk)fa+=0.3*Math.exp(-14*(t-r.tk));}
    if(t>=10)fa+=0.35*Math.exp(-8*(t-10));
    fa=clamp(fa,0,1);
    if(fa>0){ctx.fillStyle='rgba(255,255,255,'+fa.toFixed(3)+')';ctx.fillRect(0,0,W,H);}

    // 标题 / 副标
    ctx.globalCompositeOperation='source-over';
    const ta=0.9*smoothstep(9.7,10.3,t)*(1-smoothstep(11.4,12,t));
    if(ta>0){ctx.globalAlpha=ta;ctx.fillStyle='#F6EBD0';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 300px "Noto Serif SC","Songti SC","SimSun",serif';ctx.fillText(TITLE,CX,545);ctx.globalAlpha=1;}
    const sa=0.85*smoothstep(9.6,10.4,t)*(1-smoothstep(11.4,12,t));
    if(sa>0){ctx.globalAlpha=sa;ctx.fillStyle='#EDE6D6';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='40px "Noto Serif SC","Songti SC","SimSun",serif';ctx.fillText(SUB,CX,790);ctx.globalAlpha=1;}

    // 暗角
    const vg=ctx.createRadialGradient(CX,CY,400,CX,CY,1150);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

    // 首尾淡入淡出
    const fade=(1-smoothstep(0,0.35,t))+smoothstep(11.4,12,t);
    ctx.fillStyle='rgba(0,0,0,'+clamp(fade,0,1).toFixed(3)+')';ctx.fillRect(0,0,W,H);
  }

  // ---------- 主循环 ----------
  const params=new URLSearchParams(location.search);
  const fixedT=params.get('t');
  if(fixedT!==null){
    draw(((parseFloat(fixedT)%TOTAL)+TOTAL)%TOTAL);
  }else{
    let paused=false,base=performance.now(),acc=0;
    function frame(now){
      if(!paused){acc+=(now-base)/1000;base=now;}
      draw(((acc%TOTAL)+TOTAL)%TOTAL);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    window.addEventListener('keydown',function(e){
      if(e.code==='Space'){e.preventDefault();paused=!paused;base=performance.now();}
    });
  }
})();
</script>
</body>
</html>
